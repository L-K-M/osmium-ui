name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run typecheck
      # Apps compile the TypeScript source with their own compiler, so
      # check it against the newest one too.
      - run: npx --yes -p typescript@latest tsc --noEmit
      - run: npm test
      - run: npm run demo:build
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      # The Swift package: a compile check of macos/OsmiumWindows.swift
      # as a library, the way SwiftPM consumers build it.
      - run: swift build
      - run: make -C demo/macos
      - run: test -x demo/macos/OsmiumDemo.app/Contents/MacOS/OsmiumDemo
      # Swift 6 language mode: its data-race checks cover the window
      # host too, which the demo compiles in. Warnings fail the build: a
      # delegate method that only nearly matches its requirement is a
      # warning, and AppKit would never call it.
      - run: make -C demo/macos SWIFT_VERSION=6 SWIFTFLAGS=-warnings-as-errors
