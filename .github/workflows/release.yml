name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Verify and draft library release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        id: source
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version != package.json version $pkg_version"
            exit 1
          fi

          if [ "$(git cat-file -t "$GITHUB_REF")" != 'tag' ]; then
            echo "::error::$GITHUB_REF must be an annotated tag"
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release commit is not on main"
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Verify the library
        run: |
          npm ci
          npm run typecheck
          npm test

      # Git installs, and the apps that bundle Osmium UI, get what npm
      # packs. NOTICE scopes the Unlicense to the kit's own code; npm
      # packs it only because package.json "files" lists it.
      - name: Check the packed license files
        run: |
          npm pack --dry-run --json | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files;
            for (const name of ["LICENSE", "README.md", "NOTICE"]) {
              if (files.some((f) => f.path === name && f.size > 0)) continue;
              console.log(`::error::${name} is missing or empty in the package`);
              process.exitCode = 1;
            }'
          grep -q 'src/fonts/' NOTICE ||
            { echo "::error::NOTICE does not name src/fonts/"; exit 1; }
          sed -n '/^## License/,$p' README.md | grep -q '`NOTICE`' ||
            { echo "::error::README's License section does not mention NOTICE"; exit 1; }

      # A source library: the release is the tag plus notes, no artifacts.
      - name: Publish draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: osmium-ui ${{ steps.source.outputs.version }}
          draft: true
          generate_release_notes: true
